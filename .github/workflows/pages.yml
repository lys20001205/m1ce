name: Validate and deploy ROUNDHOUSE 3D
on:
  push:
    branches: [master, v10-recovery]
    paths-ignore: ['docs/**', '**.md', 'tools/pull_telemetry.py', '.github/workflows/telemetry.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roundhouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deterministic rules and syntax
        run: |
          set -o pipefail
          mkdir -p artifacts
          for f in src/*.js; do node --check "$f"; done
          npm test | tee artifacts/rule-tests.txt
      - run: npm run build
      - name: Model serialization regression
        run: |
          set -o pipefail
          node --test tests/model_roundtrip.test.mjs | tee artifacts/model-tests.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fixed browser tests
        run: |
          pip install playwright==1.56.0 pillow==12.0.0
          python -m playwright install --with-deps chromium webkit
      - name: Actual WebGL and V10 mobile regressions
        run: xvfb-run -a python tests/browser_smoke.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-validation
          path: artifacts/
          retention-days: 7
      - name: Upload built site for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-site
          path: dist/
          retention-days: 7
      - name: Stage Pages only after successful tests
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
