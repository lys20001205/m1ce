name: ROUNDHOUSE Telemetry Pull

on:
  push:
    branches:
      - master
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Pull recent mobile telemetry
        run: python tools/pull_telemetry.py

      - name: Upload telemetry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: roundhouse-telemetry
          path: telemetry_snapshot.json
          retention-days: 7
