name: ROUNDHOUSE Telemetry Pull
on:
  push:
    branches: [master]
    paths: ['tools/pull_telemetry.py', '.github/workflows/telemetry.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telemetry-pull
  cancel-in-progress: true
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/pull_telemetry.py
      - uses: actions/upload-artifact@v4
        with:
          name: roundhouse-telemetry
          path: telemetry_snapshot.json
          retention-days: 7
